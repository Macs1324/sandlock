[package]
name = "sandlock"
version = "0.1.0"
edition = "2024"
description = "Wayland screen locker: the desktop dissolves into a storm of its own pixels"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
png = "0.18.1"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
smithay-client-toolkit = "0.21.1"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
# wgpu needs the C `wl_display` pointer, which only the system backend has.
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wgpu = "30.0.1"

[dev-dependencies]
# Validates the WGSL shaders in `cargo test` (wgpu only reports shader errors
# at runtime); the same naga wgpu builds on, so nothing new is compiled.
naga = { version = "30.0.1", features = ["wgsl-in"] }

[profile.release]
lto = "thin"

# wgpu's unoptimised validation makes debug builds crawl (about 1 fps); keep
# debug assertions (and the test hooks) for sandlock but optimise everything.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# `cargo deb` builds the Ubuntu package (24.04 and newer).
[package.metadata.deb]
maintainer = "Macs1324 <max.blank410@gmail.com>"
copyright = "Macs1324"
section = "x11"
extended-description = """\
When you lock, your desktop dissolves into a storm of its own pixels, carried \
by a fluid simulation on the GPU. Needs a compositor with ext-session-lock-v1 \
and wlr-screencopy-v1, such as niri, Hyprland or Sway."""
# The Vulkan loader and libwayland-client are loaded with dlopen, so $auto
# does not see them.
depends = "$auto, libvulkan1, libwayland-client0"
recommends = "mesa-vulkan-drivers | vulkan-icd"
assets = [
  ["target/release/sandlock", "usr/bin/", "755"],
  ["packaging/debian/pam", "etc/pam.d/sandlock", "644"],
  ["README.md", "usr/share/doc/sandlock/", "644"],
]
