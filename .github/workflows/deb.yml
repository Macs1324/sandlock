# Builds the Ubuntu .deb on 24.04 (so it installs on 24.04 and newer) and
# attaches it to the GitHub release for each pushed `v*` tag.
name: deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libpam0g-dev libwayland-dev libxkbcommon-dev
      # wgpu 30 needs rustc 1.87, newer than the runner may ship.
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deb --locked
      - run: cargo deb --locked
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.runner }}
          path: target/debian/*.deb
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" target/debian/*.deb --clobber
